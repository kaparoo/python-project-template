# ========================== #
#      Project Metadata      #
# ========================== #

[project]
name = "PROJECT_NAME"  # FIX HERE
version = "0.1.0"
description = "PROJECT_DESCRIPTION"  # FIX HERE
readme = "README.md"
requires-python = ">=3.14.0"
license = "MIT"
authors = [
    { name = "Jaewoo Park", email = "kaparoo2001@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    # See https://pypi.org/classifiers/ for more classifiers
]
keywords = []  # FIX HERE
dependencies = []  # FIX HERE

[project.urls]
GitHub = "https://www.github.com/kaparoo/REPOSITORY"  # FIX HERE

# ========================== #
#      [tool.*] Sections     #
# ========================== #

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]

[tool.mypy]
cache_dir = "./.cache/mypy"
exclude = ["tests/"]
pretty = true
show_error_codes = true
show_column_numbers = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
allow_redefinition = true
no_implicit_optional = true
# plugins = ["numpy.typing.mypy_plugin"]  # Uncomment if using numpy
# See the following documentation for more information
# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml

[tool.pytest]
minversion = "9.0"
cache_dir = "./.cache/pytest"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# See the following documentation for more information
# https://docs.pytest.org/en/stable/reference/customize.html
# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options

[tool.ruff]
# Require specific ruff version (for environment consistency)
required-version = ">=0.14.13"
# Cache directory
cache-dir = "./.cache/ruff"
# Exclude patterns
extend-exclude = [".cache", ".venv*", ".vscode", "tests"]
# Line length (default: 88, Black-compatible)
line-length = 88
# Indentation width (default: 4)
indent-width = 4
# Enable preview mode for unstable features (uncomment to enable)
# preview = true
# See the following documentation for more information
# https://docs.astral.sh/ruff/configuration/
# https://docs.astral.sh/ruff/settings/
# https://docs.astral.sh/ruff/rules/

[tool.ruff.lint]
select = [
    # Core linting
    "E",     # pycodestyle (errors)
    "F",     # pyflakes
    "W",     # pycodestyle (warnings)
    # Code quality
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PERF",  # Perflint
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
    # Security
    "S",     # flake8-bandit (security)
    # Type checking
    "ANN",   # flake8-annotations
    "TC",    # flake8-type-checking
    # Import and organization
    "I",     # isort
    "TID",   # flake8-tidy-imports
    "INP",   # flake8-no-pep420 (implicit namespace packages)
    # Testing
    "PT",    # flake8-pytest-style
    # Error handling
    "BLE",   # flake8-blind-except
    "TRY",   # tryceratops
    # Best practices
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "SLF",   # flake8-self
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "SLOT",  # flake8-slots
    # String handling
    "Q",     # flake8-quotes
    "ISC",   # flake8-implicit-str-concat
    "FLY",   # flynt
    # Modern Python
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    # Date and time
    "DTZ",   # flake8-datetimez
    # Other quality checks
    "FBT",   # flake8-boolean-trap
    "COM",   # flake8-comma
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "PGH",   # pygrep-hooks
    "N",     # pep8-naming
    "YTT",   # flake8-2020
    "ERA",   # eradicate
    "NPY",   # NumPy-specific rules
]
ignore = [
    # Complexity rules (often too strict for practical code)
    "PLR0904",  # too-many-public-methods
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0916",  # too-many-boolean-expressions
    "PLR2004",  # magic-value-comparison
    # Exception handling
    "TRY003",   # raise-vanilla-args
    # Formatter conflicts (handled by ruff format)
    "E501",     # line-too-long
    "W191",     # tab-indentation
    "E111",     # indentation-not-multiple-of-four
    "E114",     # indentation-not-multiple-of-four-comment
    "E117",     # over-indented
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
# Security checks can be customized here if needed
# check-typed-exception = true

[tool.ruff.lint.flake8-pytest-style]
# Pytest style configuration
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.flake8-quotes]
# Quote style configuration (should match tool.ruff.format.quote-style)
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
# TEMPLATE NOTE: Replace "project" with your actual project/package name
known-first-party = ["project"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true  # Skip docstrings which fit on a single line.

[tool.ruff.format]
# Quote style (default: "double")
quote-style = "double"
# Indentation style (default: "space")
indent-style = "space"
# Format code examples in docstrings (default: false)
docstring-code-format = true
# Line endings (default: "auto" - auto-detect per file)
line-ending = "auto"
# Enable preview mode for unstable formatter features (uncomment to enable)
# preview = true
# See the following documentation for more information
# https://docs.astral.sh/ruff/formatter/
# https://docs.astral.sh/ruff/settings/#format

